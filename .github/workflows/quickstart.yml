name: Quickstart

# Not from argus-pkg-template: this repo's own check that deploy/quickstart still parses as compose.
# tests/test_quickstart.py (run by CI) checks the config and that its policy files match examples/.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        working-directory: deploy/quickstart
        run: |
          docker compose version
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.gpu.yaml config -q
          docker compose -f compose.yaml -f compose.iris.yaml config -q
          docker compose -f compose.yaml -f compose.demo.yaml config -q
          docker compose -f compose.yaml -f compose.demo.yaml -f compose.voice.yaml config -q
