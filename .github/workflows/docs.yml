name: Docs

# Published docs (README.md + docs/**/*.md) are imported by the demo UIs at dev
# HEAD, so check them on every push to dev as well as on tags.
# docs/cli.md is generated: regenerate it with `make docs` after changing the CLI.

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  docs:
    uses: smk762/argus-ci/.github/workflows/docs-check.yml@v1
    with:
      cli-module: argus_scout.cli
      cli-name: argus-scout
      install-extras: cli
    secrets:
      denylist: ${{ secrets.DOCS_DENYLIST }} # optional; unset = no private terms
