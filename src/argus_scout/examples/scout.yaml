# argus-scout config: names every other file scout reads and every service it talks to.
#
# Relative paths resolve against this file's directory. Secrets never go here:
# name the environment variable instead (token_env, auth_env, api_key_env) and put
# the value in .env beside this file (see .env.example) or in the real environment,
# which wins over .env. Unknown keys are rejected. Check with:
#   argus-scout check config scout.yaml
#
# Scout refuses to start on an invalid config. The policy files below are different:
# they reload while scout runs, and a bad edit to one falls back to defaults.

# Policy files. Each is optional; leave one out to use built-in defaults.
# Commented examples of each are in the repo's examples/ directory.
files:
  # heartbeat: heartbeat.yaml   # what is worth interrupting for
  # approvals: approvals.yaml   # standing approvals (approve only, never deploy)
  # tariff: tariff.yaml         # time-of-use energy tariff
  # signals: signals.yaml       # PromQL rules that raise recommendations
  # persona: persona.yaml       # how the narrative sounds (a bad file falls back to the neutral default)
  # memory: memory/             # operator notes (*.md) folded into briefings; scout writes only
  #                             # scout-recent-rejections.md there

# Where scout keeps events, recommendations, approvals and reports.
store:
  path: scout.db

# Where status events come from. Each source needs a unique name.
sources:
  # Producers POST events to scout. token_env names the env var holding the bearer
  # token this source must send; leave it out to use the server-wide token.
  # - kind: webhook
  #   name: ci
  #   token_env: SCOUT_CI_TOKEN
  #
  # Scout polls a JSON endpoint and maps its fields onto status events.
  # items is the dotted path to the list in the response (leave it out if the
  # response is one item); fields maps status event fields to dotted paths.
  # - kind: json_poll
  #   name: backups
  #   url: http://backups:8080/status
  #   interval: 300               # seconds
  #   items: jobs
  #   fields:
  #     event_id: id
  #     summary: message
  #     severity: level
  #   # id: [labels.alertname, labels.instance]  # what identifies an item when it has no event_id
  #   # resolve_missing: true     # close events a successful poll no longer lists (the default)
  #   auth_header: Authorization
  #   auth_env: SCOUT_BACKUPS_AUTH  # value sent in auth_header, e.g. "Bearer ..."
  #
  # Any other kind comes from an installed plugin (entry-point group argus_scout.sources),
  # which validates its own keys. Try a poll without writing anything:
  #   argus-scout poll --config scout.yaml [--source backups]

# Where reports and status items go. Each channel needs a unique name. Every channel
# takes: enabled (default true), min_severity (info|notice|warning|critical; default
# info), kinds (report kinds such as morning, or "event" for an inbox item; default
# all) and timeout (seconds per delivery, retries included; default 30).
# A message is sent to a channel at most once, even across restarts.
channels:
  # Append to a plain-text file beside this config (tail -f it). The file stays under
  # dir: no "..", no absolute path, no symlink out. {kind} and {date} are filled in.
  - kind: text
    name: log
    dir: .
    file: scout-reports.log
    # rotate_bytes: 1048576     # rotate before the file grows past this; leave out to never rotate
    # keep: 3                   # rotated files to keep
  #
  # POST JSON (schema argus-scout.delivery, see docs/channels.md) to one URL; only
  # that host is allowed. Retries a connection error, 408, 429 or 5xx with backoff.
  # - kind: webhook
  #   name: chat
  #   url: https://<HOOK_HOST>/scout
  #   token_env: SCOUT_CHAT_TOKEN     # optional: sent as a bearer token
  #   secret_env: SCOUT_CHAT_SECRET   # optional: HMAC-SHA256 key for X-Scout-Signature
  #   retries: 2
  #   backoff: 1.0
  #   min_severity: notice
  #   kinds: [morning, evening, event]
  #
  # Any other kind comes from an installed plugin (entry-point group argus_scout.channels),
  # which validates its own keys. Re-send the newest report:
  #   argus-scout deliver --config scout.yaml --latest [--kind morning] [--channel log]

schedule:
  analysis_interval: 900          # seconds between analysis cycles
  status_interval: 300            # seconds between status cycles
  timezone: UTC                   # IANA name, e.g. Europe/London
  briefings:                      # kind: morning, evening or status
    - kind: morning
      at: "07:30"
    - kind: evening
      at: "19:00"

# Services scout talks to. All optional: leave one out and what depends on it is off.
services:
  # prometheus_url: http://prometheus:9090   # read-only PromQL; scout never scrapes hosts
  # The model briefings are written with. Leave it out and reports come from a plain template.
  # If the model is down or over its daily cap, that report falls back to the template too.
  # llm:
  #   backend: ollama                        # ollama (/api/chat) or openai (any OpenAI-compatible API)
  #   base_url: http://ollama:11434          # for openai, include the prefix: http://llm:8000/v1
  #   model: <MODEL>
  #   api_key_env: SCOUT_LLM_API_KEY         # hosted backends only
  #   timeout: 120                           # seconds per call
  #   max_tokens: 400                        # most tokens one report may generate
  #   context_tokens: 3072                   # the model's context window; prompts are cut to fit
  # argus-echo, for speech on voice channels (Snapcast, argus-mask ...). Leave it out and voice
  # channels stay silent; text still goes out. Scout synthesises once per message and never holds
  # a GPU lease for it: echo takes its own. (echo_url was replaced by this block.)
  # echo:
  #   url: http://echo:8000                  # an engine's root: Miso, XTTS-v2 or Qwen3-TTS
  #   voice_clone_id: <CLONE_ID>             # a stored clone; or speaker: <SPEAKER> (a built-in one)
  #   language: en
  #   format: pcm_s16le                      # what voice channels get: pcm_s16le or wav
  #   timeout: 60                            # seconds per synthesis with the model loaded
  #   load_timeout: 180                      # ... when echo has to load the model first
  #   max_seconds: 300                       # the longest speech accepted
  #   extra: {}                              # engine-specific fields, e.g. {temperature: 0.7} for Miso

# Daily usage caps: a ceiling in case a loop misbehaves. 0 or a missing kind is unlimited.
# Counts reset at local midnight and are kept in usage.json beside the store.
budget:
  limits:
    llm_calls: 48                 # model calls for reports (briefings and status updates)
  block_manual: false             # true: refuse over-cap work started by a person too

# The redelivery sweep: a report a channel failed to take is sent to that channel again.
delivery:
  retry_interval: 300             # seconds between sweeps
  retry_max_age: 21600            # stop retrying a report this many seconds after it was written
  max_attempts: 5                 # failed attempts per channel before giving up (a 4xx refusal: no retry)
  speak_max_age: 600              # older than this, a retry is text only: late speech is worse than none

server:
  host: 127.0.0.1                 # reads have no auth unless read_auth: keep scout on loopback
  port: 8400
  read_only: true                 # refuse every state-changing route; turn off once the token is set
  allowed_origins: []             # browser origins trusted for writes
  token_env: SCOUT_API_TOKEN      # bearer token for write routes (unset: writes are closed)
  read_auth: false                # also require the token on /api/* reads and /wall
