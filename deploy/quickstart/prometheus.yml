# Prometheus for the argus-scout quickstart. Scout queries it with PromQL (services.prometheus_url) and
# never scrapes or connects to the hosts itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The example signal rules expect node exporter under job="node" (node-exporter-down, high-load, ...).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Scout's own state: open items, recommendations, usage caps, deliveries.
  - job_name: scout
    metrics_path: /metrics
    static_configs:
      - targets: ["scout:8400"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
