# Prometheus for the demo (compose.demo.yaml): the quickstart's jobs plus the simulator. Scout queries it with
# PromQL and never scrapes or connects to the simulator itself.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The pretend house: power loads, the energy meter and a GPU, as a smart plug, a meter and dcgm-exporter
  # would publish them.
  - job_name: house
    scrape_interval: 5s
    static_configs:
      - targets: ["simulator:9101"]
        labels:
          instance: demo-gpu-node

  - job_name: scout
    metrics_path: /metrics
    static_configs:
      - targets: ["scout:8400"]
        labels:
          argus_peer: scout
          argus_service: argus-scout
          node: demo

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
