# The demo config with speech (compose.voice.yaml): scout.yaml plus argus-echo (XTTS, a built-in speaker, not a
# clone) and the argus-mask face. The URLs come from the suite-wide ARGUS_XTTS_URL and ARGUS_MASK_URL, which
# compose.voice.yaml sets. tests/test_demo.py checks this file is scout.yaml plus exactly these parts.
files:
  heartbeat: heartbeat.yaml
  approvals: approvals.yaml
  tariff: tariff.yaml             # written by the simulator, with the peak period happening now
  signals: signals.yaml
  persona: persona.yaml

store:
  path: scout.db

sources:
  - kind: suite_status
    name: suite

channels:
  - kind: text
    name: log
    dir: .
    file: scout-reports.log
    rotate_bytes: 1048576
    keep: 3
  # The face speaks every report. Open http://127.0.0.1:8109/?face=stock-01 and click once to allow sound:
  # with no screen watching, mask answers "not ready" and scout skips it (text still goes out).
  - kind: mask
    name: face
    face: stock-01
    timeout: 300

schedule:
  analysis_interval: 20           # seconds: the rules' for: windows are a minute, so scenarios land quickly
  status_interval: 30
  timezone: UTC                   # the simulator writes the tariff in UTC wall-clock time
  briefings: []                   # demo.sh asks for reports; first-brief writes one at startup

services:
  prometheus_url: http://prometheus:9090
  llm:
    backend: ollama
    base_url: http://ollama:11434
    model: llama3.2:1b
    timeout: 180
  echo:
    peer: xtts                    # the URL is ARGUS_XTTS_URL
    speaker: Aaron Dreschner      # an XTTS-v2 built-in studio speaker
    language: en
    timeout: 240                  # XTTS on a CPU is slower than real time
    load_timeout: 300

budget:
  limits:
    llm_calls: 200

server:
  host: 0.0.0.0
  port: 8400                      # published on loopback only
  read_only: false                # demo.sh approves and asks for reports; every write needs the token
  token_env: SCOUT_API_TOKEN      # demo.sh writes a random one into .env on first run
  read_auth: false
