[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-scout"
dynamic = ["version"]
description = "Homelab intelligence for the Argus suite: reads your telemetry, reasons about it, and reports back with briefings and recommendations it never acts on"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "argus-cortex[remote]>=0.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.7"]
cli = ["rich>=13.0"]
# httpx2 backs starlette's TestClient: starlette >=1.3 deprecated the httpx path
# and raises when neither client is installed, so testing the server needs it.
dev = ["argus-scout[server]", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.15.16", "httpx2>=2.7"]

[project.scripts]
argus-scout = "argus_scout.cli:app"

# Status source kinds. A third-party package adds a kind by registering in this group.
[project.entry-points."argus_scout.sources"]
webhook = "argus_scout.sources.webhook:plugin"
json_poll = "argus_scout.sources.json_poll:plugin"

[project.urls]
Repository = "https://github.com/smk762/argus-scout"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_scout/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_scout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["src/argus_scout/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
